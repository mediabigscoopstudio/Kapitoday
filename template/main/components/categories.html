
<section class="kapi-categories-section py-5">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="section-title h5 mb-0 fw-bold">Shop by Category</h2>
            <a href="/shop" class="text-gold fw-bold text-decoration-none">See All &rarr;</a>
        </div>
        
        <div class="category-strip-container">
            <div class="category-strip">
                {% for cat in categories %}
                <a href="/shop?category={{ cat.slug }}" class="category-card">
                    <div class="category-img-wrapper">
                        {% if cat.category_image %}
                        <img src="{{ cat.category_image.url }}" alt="{{ cat.title }}">
                        {% else %}
                        <div class="category-placeholder"></div>
                        {% endif %}
                    </div>
                    <div class="category-name">{{ cat.title }}</div>
                </a>
                {% endfor %}
            </div>
        </div>
    </div>
</section>
