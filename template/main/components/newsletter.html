
<style>
    .kapi-newsletter-section {
        background-color: #432521;
        position: relative;
        overflow: hidden;
    }
    .news-img-left {
        position: absolute;
        left: -5%;
        bottom: -10%;
        width: 35%;
        max-width: 450px;
        z-index: 1;
        /* Using multiply to hide the white/grey background of the provided JPG */
        mix-blend-mode: multiply;
        filter: brightness(1.2) contrast(1.1);
    }
    .news-img-right {
        position: absolute;
        right: -2%;
        bottom: 0;
        width: 32%;
        max-width: 420px;
        z-index: 1;
        mix-blend-mode: multiply;
        filter: brightness(1.2) contrast(1.1);
    }
    .news-content {
        position: relative;
        z-index: 3;
    }
    .news-input {
        background-color: rgba(255, 255, 255, 0.1) !important;
        border: 1px solid rgba(255, 255, 255, 0.2) !important;
        color: #fff !important;
        box-shadow: none !important;
    }
    .news-input::placeholder {
        color: rgba(255, 255, 255, 0.6) !important;
    }
    .news-input:focus {
        border-color: #D4B872 !important;
        background-color: rgba(255, 255, 255, 0.15) !important;
    }
    .news-btn {
        background-color: #D4B872;
        color: #111;
        border: none;
        transition: background 0.3s;
    }
    .news-btn:hover {
        background-color: #e6c87a;
    }
    @media (max-width: 991px) {
        .news-img-left, .news-img-right {
            opacity: 0.15;
            mix-blend-mode: normal;
        }
    }
</style>

<section class="kapi-newsletter-section text-center py-5">
    
    <!-- Left & Right Images -->
    <img src="/static/main/images/home/news-left.webp" alt="Coffee Cherries" class="news-img-left d-none d-md-block">
    <img src="/static/main/images/home/news-right.webp" alt="Brass Coffee Filter" class="news-img-right d-none d-md-block">
    
    <div class="container py-5 news-content">
        <div class="text-uppercase fw-bold mb-3" style="color: #D4B872; letter-spacing: 2px; font-size: 0.8rem;">JOIN THE KAPI CULTURE</div>
        
        <!-- Explicitly white as requested -->
        <h2 class="display-5 fw-bold mb-3 text-white" style="font-family: var(--font-heading); line-height: 1.2;">Good Coffee. Brighter Days.</h2>
        
        <p class="mb-5 mx-auto" style="color: #E0E0E0; max-width: 550px; font-size: 0.95rem; line-height: 1.6;">
            Get updates on new harvests, brewing tips, exclusive offers and stories from our plantations.
        </p>
        
        <form class="d-flex mx-auto position-relative" style="max-width: 480px;">
            <i class="bi bi-envelope position-absolute top-50 translate-middle-y ms-4" style="color: rgba(255,255,255,0.6);"></i>
            <input type="email" class="form-control rounded-pill news-input py-3" style="padding-left: 3rem; padding-right: 140px;" placeholder="Enter your email address" required>
            <button type="submit" class="btn rounded-pill position-absolute top-0 end-0 h-100 fw-bold news-btn" style="padding: 0 32px; font-size: 0.9rem; margin: 4px; height: calc(100% - 8px) !important;">Subscribe</button>
        </form>
    </div>
</section>
