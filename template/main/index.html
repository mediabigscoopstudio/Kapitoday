{% extends 'main/base.html' %}
{% load static %}

{% block 'title' %}Kapi Today | From South India to the World{% endblock 'title' %}

{% block 'meta' %}
<meta name="description" content="Single-origin Indian coffee, from misty plantations to your morning cup. Rich in heritage, crafted for today.">
{% endblock 'meta' %}

{% block 'css' %}
<style>
/* ==========================================
   STAGE 3: HERO SECTION
   ========================================== */
.kapi-hero {
    position: relative;
    height: 85vh;
    min-height: 600px;
    background-color: var(--kapi-espresso);
    overflow: hidden;
}
.kapi-hero-img {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: cover;
    z-index: 1;
}
.kapi-hero-overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: linear-gradient(to right, rgba(26,20,18,0.9) 0%, rgba(26,20,18,0.4) 60%, rgba(26,20,18,0.1) 100%);
    z-index: 2;
}
.kapi-hero-content {
    position: relative;
    z-index: 3;
    color: #fff;
}
.hero-tagline {
    font-size: 0.85rem;
    font-weight: 700;
    letter-spacing: 2px;
    color: var(--kapi-gold-accent, #C9A84C);
    margin-bottom: 1rem;
    text-transform: uppercase;
}
.hero-title {
    font-family: var(--font-heading);
    font-size: clamp(3rem, 6vw, 5rem);
    font-weight: 900;
    line-height: 1.1;
    margin-bottom: 1.5rem;
}
.text-gold {
    color: var(--kapi-gold-accent, #C9A84C);
}
.hero-subtitle {
    font-size: 1.1rem;
    line-height: 1.6;
    opacity: 0.9;
    max-width: 480px;
}
.btn-hero-primary {
    background-color: var(--kapi-gold-accent, #C9A84C);
    color: var(--kapi-espresso);
    padding: 12px 28px;
    border-radius: 30px;
    font-weight: 700;
    text-decoration: none;
    transition: all 0.3s;
}
.btn-hero-primary:hover {
    background-color: var(--kapi-brass-light);
    color: var(--kapi-espresso);
    transform: translateY(-2px);
}
.btn-hero-secondary {
    display: flex;
    align-items: center;
    gap: 8px;
    background-color: rgba(255,255,255,0.1);
    backdrop-filter: blur(8px);
    color: #fff;
    padding: 12px 28px;
    border-radius: 30px;
    font-weight: 600;
    text-decoration: none;
    border: 1px solid rgba(255,255,255,0.3);
    transition: all 0.3s;
}
.btn-hero-secondary:hover {
    background-color: rgba(255,255,255,0.2);
    color: #fff;
}
.hero-badge {
    position: absolute;
    bottom: 40px;
    right: 60px;
    z-index: 3;
    display: flex;
    align-items: center;
    gap: 16px;
    background: rgba(44, 24, 16, 0.8);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(201, 168, 76, 0.3);
    padding: 16px 24px;
    border-radius: 12px;
    color: #fff;
}
.hero-badge .badge-icon {
    width: 32px;
    height: 32px;
    filter: brightness(0) invert(1) sepia(1) saturate(5) hue-rotate(35deg); /* Golden tint */
}
.badge-text {
    font-size: 0.8rem;
    line-height: 1.4;
    color: #e0e0e0;
}
.badge-text strong {
    color: var(--kapi-gold-accent);
    font-size: 0.9rem;
}

@media (max-width: 767px) {
    .kapi-hero-overlay {
        background: linear-gradient(to bottom, rgba(26,20,18,0.2) 0%, rgba(26,20,18,0.8) 50%, rgba(26,20,18,1) 100%);
    }
    .kapi-hero-content {
        margin-top: auto;
        padding-bottom: 40px;
    }
    .kapi-hero {
        align-items: flex-end;
        display: flex;
        height: 90vh;
    }
    .hero-actions {
        flex-direction: column;
        width: 100%;
    }
    .btn-hero-primary, .btn-hero-secondary {
        width: 100%;
        text-align: center;
        justify-content: center;
    }
}
</style>
{% endblock 'css' %}

{% block 'body' %}
    {% include 'main/components/hero.html' %}
    
    <!-- Stage 4-11 components will go here -->
    
{% endblock 'body' %}
