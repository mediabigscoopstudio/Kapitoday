{% extends "dash/index.html" %}
{% block 'title' %}Add Event{% endblock 'title' %}
{% block 'css' %}{% endblock 'css' %}
{% block 'body' %}
<div class="container-fluid">
    <div class="py-3">
        <h4 class="fs-18 fw-semibold">Create Event</h4>
    </div>

    <div class="card">
        <div class="card-body">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Title</label>
                    <input type="text" class="form-control" name="title" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Location</label>
                    <input type="text" class="form-control" name="location" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea class="form-control" name="description" rows="3"></textarea>
                </div>
                <div class="mb-3">
                    <label class="form-label">Date</label>
                    <input type="date" class="form-control" name="date" required>
                </div>

                <div class="row">
                    <div class="col-md-4">
                        <label class="form-label">Meta Title</label>
                        <input type="text" class="form-control" name="meta_title">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Meta Description</label>
                        <textarea class="form-control" name="meta_description"></textarea>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Meta Keywords</label>
                        <input type="text" class="form-control" name="meta_keywords">
                    </div>
                </div>

                <div class="mt-3">
                    <label class="form-label">Content</label>
                    <div id="editor"></div>
                    <input type="hidden" name="content" id="contentInput">
                </div>

                <div class="row mt-3">
                    <div class="col-md-6">
                        <label class="form-label">Banner Image</label>
                        <input type="file" class="form-control" name="banner_image">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Thumbnail Image</label>
                        <input type="file" class="form-control" name="thumbnail_image">
                    </div>
                </div>

                <button class="btn btn-primary mt-4" type="submit">Save Event</button>
            </form>
        </div>
    </div>
</div>

<link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
<script src="https://cdn.quilljs.com/1.3.6/quill.js"></script>

<script>
    var quill = new Quill('#editor', {
        theme: 'snow',
        modules: {
            toolbar: [
                ['bold', 'italic', 'underline'],
                [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                ['image', 'link'],
                ['clean']
            ]
        }
    });

    document.querySelector('form').onsubmit = function () {
        document.getElementById('contentInput').value = quill.root.innerHTML;
    };
</script>
{% endblock 'body' %}
{% block 'script' %}{% endblock 'script' %}
